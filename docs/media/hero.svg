    <text x="92" y="50" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="40" font-weight="600" fill="#E9E6DF">LANLink</text>
  </g>
  <text x="64" y="208" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="46" font-weight="600" fill="#E9E6DF">Your PC, in your hand.</text>
  <text x="64" y="254" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21" fill="#A9AEB6">Control Windows 11 from an Android phone over your own Wi-Fi.</text>
  <text x="64" y="286" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21" fill="#A9AEB6">No cloud, no account, encrypted end to end, approved on the PC.</text>
