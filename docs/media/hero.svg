<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="LANLink: your Windows PC on your Android phone, over your own Wi-Fi">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15181C"/><stop offset="1" stop-color="#1E2227"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" x2="1">
      <stop offset="0" stop-color="#D9B98C" stop-opacity="0"/><stop offset=".5" stop-color="#D9B98C"/><stop offset="1" stop-color="#D9B98C" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <g transform="translate(64 60)">
