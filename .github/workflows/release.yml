name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64 Host Binaries
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup show
      - name: Build release binaries
        run: .\scripts\build-host.ps1
      - name: Package Windows archive
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME -like "v*") { $env:GITHUB_REF_NAME } else { "v0.1.0" }
          $stage = "dist/lanlink-$version-windows-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/release/lanlink-host.exe $stage/
          Copy-Item target/release/lanlink-host-console.exe $stage/
          Copy-Item scripts/firewall-allow.ps1 $stage/
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE $stage/
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/lanlink-$version-windows-x64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/lanlink-*-windows-x64.zip

  build-android:
    name: Android Release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Rust Android targets & cargo-ndk
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build native libraries and Release APK
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -P 29 -o android/app/src/main/jniLibs build --profile release-android -p lanlink-android
          cd android
          ./gradlew --no-daemon :app:assembleRelease
      - name: Stage APK
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME:-v0.1.0}"
          if [[ "$VERSION" != v* ]]; then VERSION="v0.1.0"; fi
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release*.apk "dist/lanlink-${VERSION}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/lanlink-*-android.apk

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA256SUMS.txt
        working-directory: artifacts
        run: sha256sum lanlink-* > SHA256SUMS.txt
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/lanlink-*
            artifacts/SHA256SUMS.txt
