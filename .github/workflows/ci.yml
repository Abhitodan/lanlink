# Checks that need no GPU or interactive desktop. The live capture, input and
# end-to-end tests skip themselves on a CI runner (no unlocked desktop), so
# run scripts\test-all.ps1 on a real PC before a release.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace -- --test-threads=1

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Unit tests and lint
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug
